name: Check Python and website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest
      - run: python thermodynamic_feasibility_tester_MASTER.py --self-test
      - run: node --test website/test_ui.cjs
      - run: python build_pages.py
      - run: git diff --exit-code -- docs
